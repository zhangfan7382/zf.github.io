<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💝 帆爱萃萃 💝</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            font-family: "Microsoft YaHei", sans-serif;
            padding: 20px;
        }

        .message-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 600px;
            width: 90%;
        }

        .title {
            color: #ff6b6b;
            font-size: 2.5em;
            margin-bottom: 30px;
            font-weight: bold;
        }

        .message-box {
            background: #fff5f5;
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .message-text {
            font-size: 1.2em;
            color: #ff4757;
            line-height: 1.6;
            margin: 0;
        }

        .get-message-btn {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .get-message-btn:hover {
            background: #ff4757;
            transform: translateY(-2px);
        }

        .get-message-btn:disabled {
            background: #ffb8b8;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loading-text {
            color: #ff6b6b;
            font-size: 1.1em;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-box {
            animation: fadeIn 0.5s ease-out;
        }
    </style>
</head>
<body>
    <div class="message-card">
        <h1 class="title">💝 情话 💝</h1>
        <div class="message-box" id="messageBox">
            <p class="message-text" id="messageText">正在加载情话...</p>
        </div>
        <button class="get-message-btn" id="getMessageBtn" onclick="getLoveMessage()">点击获取帆帆想对你说的话</button>
    </div>

    <script>
        const messageText = document.getElementById('messageText');
        const getMessageBtn = document.getElementById('getMessageBtn');
        let isLoading = false;

        async function getLoveMessage() {
            if (isLoading) return;
            
            isLoading = true;
            getMessageBtn.disabled = true;
            getMessageBtn.textContent = '获取中...';
            messageText.textContent = '正在加载情话...';

            try {
                const response = await fetch('https://api.uomg.com/api/rand.qinghua?format=json');
                const data = await response.json();
                messageText.textContent = data.content;
            } catch (error) {
                console.error('获取情话失败:', error);
                messageText.textContent = '获取情话失败，请稍后再试~';
            } finally {
                isLoading = false;
                getMessageBtn.disabled = false;
                getMessageBtn.textContent = '点击获取帆帆想对你说的话';
            }
        }

        // 页面加载时自动获取一条情话
        getLoveMessage();
    </script>
</body>
</html>
